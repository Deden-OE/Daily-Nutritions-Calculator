<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutri Calc</title>
<meta name="description" content="Catat makanan dan minuman harian, hitung 34 zat gizi dari TKPI dan USDA, bandingkan dengan AKG.">
<meta name="theme-color" content="#0f5a45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nutri Calc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><img class="logo" src="icons/icon.svg" alt=""><div><b id="hello">Nutri Calc</b><span id="subhello">Catat, hitung, jadi sehat</span></div></div>
  <button class="profile-chip" id="profile-chip" type="button" aria-label="Ganti profil"></button>
</div></header>

<main id="main">
  <section id="view-hari" class="view"></section>
  <section id="view-catat" class="view" hidden></section>
  <section id="view-riwayat" class="view" hidden></section>
  <section id="view-profil" class="view" hidden></section>
  <section id="view-data" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="Menu utama">
  <button data-tab="hari" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Hari ini</button>
  <button data-tab="riwayat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Riwayat</button>
  <button data-tab="catat" class="fab" aria-label="Input makanan dan minuman"><span class="fab-c"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span><span class="fab-l">Input makan<br>&amp; minum</span></button>
  <button data-tab="profil"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
  <button data-tab="data"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
